x-service-defaults: &service-defaults
  working_dir: /workspace/project
  tty: true
  stdin_open: true
  volumes:
    - ./:/workspace/project
  environment:
    PYTHONPATH: /workspace/project/src
    HF_HOME: /workspace/project/.hf-cache
    TRANSFORMERS_CACHE: /workspace/project/.hf-cache
    HUGGINGFACE_HUB_CACHE: /workspace/project/.hf-cache
  command: ["sleep", "infinity"]

services:
  controller:
    <<: *service-defaults
    image: movie-dubbing/controller:local
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
      target: controller

  separator:
    <<: *service-defaults
    image: movie-dubbing/separator:local
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      target: separator
    gpus: all
    ipc: host
    shm_size: "8gb"

  diarizer:
    <<: *service-defaults
    image: movie-dubbing/diarizer:local
    build:
      context: .
      dockerfile: docker/Dockerfile.diarizer
    gpus: all
    ipc: host
    shm_size: "8gb"

  # DiariZen 데몬(8913) — diarizer 이미지 + fastapi/uvicorn 얇은 층. fusion 의 1차 backend.
  # 기동: docker compose exec -d diarizer-daemon python src/daemons/diarize_daemon.py --port 8913
  diarizer-daemon:
    <<: *service-defaults
    image: movie-dubbing/diarizer-daemon:local
    build:
      context: .
      dockerfile: docker/Dockerfile.diarizer-daemon
    gpus: all
    ipc: host
    shm_size: "8gb"

  # fusion 데몬(8918) — 순수 파이썬(GPU 불필요). nemo 이미지 재사용(fastapi/uvicorn/requests 포함).
  # 기동: docker compose exec -d fusion python src/daemons/fusion_diarize_daemon.py --port 8918
  fusion:
    <<: *service-defaults
    image: movie-dubbing/nemo:local
    environment:
      PYTHONPATH: /workspace/project/src
      HF_HOME: /workspace/project/.hf-cache
      FUSION_DIARIZEN_URL: http://diarizer-daemon:8913
      FUSION_NEMO_URL: http://nemo:8923
    depends_on:
      - diarizer-daemon
      - nemo

  # NVIDIA Sortformer(end-to-end 화자분리) 격리 이미지 — NeMo 2.x. 화자분리 신형 모델 비교용.
  sortformer:
    <<: *service-defaults
    image: movie-dubbing/sortformer:local
    build:
      context: .
      dockerfile: docker/Dockerfile.sortformer
    gpus: all
    ipc: host
    shm_size: "8gb"

  # NeMo TitaNet ClusteringDiarizer 격리 데몬 — fusion 보강용(transformers 충돌로 diarizer와 분리).
  # 기동: docker compose exec -d nemo python src/daemons/nemo_diarize_daemon.py --port 8923
  nemo:
    <<: *service-defaults
    image: movie-dubbing/nemo:local
    build:
      context: .
      dockerfile: docker/Dockerfile.nemo
    gpus: all
    ipc: host
    shm_size: "8gb"

  # pyannote.audio 4.0 community-1 전용 — diarizer의 pyannote 3.1.1과 격리. CPU(짧은 클립).
  pyannote:
    <<: *service-defaults
    image: movie-dubbing/pyannote:local
    build:
      context: .
      dockerfile: docker/Dockerfile.pyannote
    env_file:
      - .env

  # MOSS-TTS-Local-Transformer 격리(transformers5/torch2.9+cu128) — CosyVoice 대체 후보 A/B 검증용.
  # 기동 후: docker compose exec -T mosstts python src/run_tts_mosstts.py --text ... --reference ... --output ...
  mosstts:
    <<: *service-defaults
    image: movie-dubbing/mosstts:local
    build:
      context: .
      dockerfile: docker/Dockerfile.mosstts
    gpus: all
    ipc: host
    shm_size: "8gb"

  speaker:
    <<: *service-defaults
    image: movie-dubbing/speaker:local
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      target: speaker
    gpus: all
    ipc: host
    shm_size: "8gb"

  vibevoice-asr:
    <<: *service-defaults
    image: movie-dubbing/vibevoice-asr:local
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      target: vibevoice-asr
    gpus: all
    ipc: host
    shm_size: "8gb"

  tts-cosyvoice:
    <<: *service-defaults
    image: movie-dubbing/tts-cosyvoice:local
    build:
      context: .
      dockerfile: docker/Dockerfile.tts-cosyvoice
    environment:
      PYTHONPATH: /workspace/project/src:/workspace/project/third_party/CosyVoice:/workspace/project/third_party/CosyVoice/third_party/Matcha-TTS
      HF_HOME: /workspace/project/.hf-cache
      TRANSFORMERS_CACHE: /workspace/project/.hf-cache
      HUGGINGFACE_HUB_CACHE: /workspace/project/.hf-cache
    gpus: all
    ipc: host
    shm_size: "8gb"

  # webapp 백엔드 — FastAPI. 호스트 docker socket 을 통해 위 파이프라인 서비스(controller + separator/diarizer/speaker/tts-cosyvoice) 로 docker compose exec.
  webapp-backend:
    image: movie-dubbing/webapp-backend:local
    build:
      context: .
      dockerfile: docker/Dockerfile.webapp-backend
    working_dir: /workspace/project
    tty: true
    stdin_open: true
    volumes:
      - ./:/workspace/project
      # 호스트 docker daemon 통신 — Docker Desktop on Windows 도 동일 경로로 매핑
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PYTHONPATH: /workspace/project/src:/workspace/project
      # 프로젝트 루트 — pipeline_runner 가 docker compose -f 옵션에 사용
      PROJECT_ROOT: /workspace/project
      COMPOSE_PROJECT_NAME: movie-dubbing-project
    ports:
      - "8000:8000"
    command:
      - uvicorn
      - webapp.backend.app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      # src/(파이프라인 코드, 다른 컨테이너서 docker exec 로 실행)는 감시 제외 —
      # src 편집이 백엔드를 재시작시켜 진행 중 redub(asyncio task + docker exec)을 죽이던 문제 방지
      - --reload-dir
      - webapp/backend

  # webapp 프론트엔드 — Vite dev server. /api,/static,/ws 는 webapp-backend 로 proxy.
  webapp-frontend:
    image: movie-dubbing/webapp-frontend:local
    build:
      context: .
      dockerfile: docker/Dockerfile.webapp-frontend
    working_dir: /workspace/frontend
    tty: true
    stdin_open: true
    volumes:
      - ./webapp/frontend:/workspace/frontend
      # node_modules 는 컨테이너 안에서만 — 호스트 OS 와 충돌 방지
      - frontend_node_modules:/workspace/frontend/node_modules
    environment:
      VITE_BACKEND_URL: http://webapp-backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - webapp-backend

volumes:
  frontend_node_modules: {}
